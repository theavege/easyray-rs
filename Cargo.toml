[package]
name = "easyray"
version = "0.0.1"
authors = ["Artem V. Ageev <artem.v.ageev@gmail.com>"]
license = "LGPL-2.1-only"
repository = "https://github.com/theavege/easyray-rs"
description = "Löve-pattern for RayLib-rs and RataTUI"
keywords = ["Löve"]
categories = ["gui"]
edition = "2024"
exclude = ["examples"]

[dependencies]
rand = { version = "0.9" }
figleter = { version = "0.2", optional = true }
ratatui = { version = "0.30", optional = true }

[target.'cfg(windows)'.dependencies]
raylib = { version = "6.0", optional = true  }

[target.'cfg(unix)'.dependencies]
raylib = { version = "6.0", features = ["nobuild"], optional = true  }

[features]
ray = ["dep:raylib"]
tui = [
    "dep:figleter",
    "dep:ratatui",
]
